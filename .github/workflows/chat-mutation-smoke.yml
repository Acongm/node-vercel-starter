name: Chat mutation smoke

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  mutation-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Kill targeted durable Chat mutants
        run: node .github/scripts/chat-mutation-smoke.mjs
