# Platform v2 site configuration
# Shared schema with auth packages/config (@acongm/config).
# Override any value with env (see loadSiteConfig).

domains:
  portal: https://www.acongm.com
  dochub: https://dochub.acongm.com
  chat: https://chat.acongm.com
  auth: https://auth.acongm.com
  api: https://api.acongm.com

git:
  owner: Acongm
  repo: portal
  contentDir: content/docs
  defaultBranch: master
  # admin direct-push target; may be master or a staging branch such as dev
  publishBranch: master

limits:
  anon:
    chatPerDay: 20
  user:
    chatPerDay: 200
